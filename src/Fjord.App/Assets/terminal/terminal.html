<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="xterm.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0c0c; }
    #term { position: absolute; inset: 6px 4px 4px 8px; }
    .xterm-viewport::-webkit-scrollbar { width: 10px; }
    .xterm-viewport::-webkit-scrollbar-thumb { background: var(--thumb, #ffffff30); border-radius: 5px; }
    .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>
  <div id="term"></div>
  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script src="addon-web-links.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
